name: Build ISO

# =============================================================================
# 404 NOT FOUND OS — FINAL one-paste ISO builder.
# The whole build runs INSIDE a real Debian bookworm container, so live-build
# matches the target distro. This avoids the Ubuntu-live-build vs Debian
# mismatches (security repo 404, firmware Contents 404, debian-installer,
# isolinux paths) that needed hand-patching before.
#
# HOW TO USE:
#   1. Repo -> Code -> .github/workflows/build-iso.yml -> pencil (Edit)
#      (or Actions -> "set up a workflow yourself" if it doesn't exist).
#   2. Select all, delete, paste THIS whole file, Commit.
#   3. Actions -> "Build ISO" -> "Run workflow".
#   4. Wait ~40-70 min. Green run -> Artifacts -> download "notfound-iso".
# =============================================================================

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /

      - name: Prepare build dir + distro config
        run: |
          set -e
          sudo mkdir -p /mnt/build
          sudo chown "$USER" /mnt/build
          cd /mnt/build
          mkdir -p auto config/package-lists config/hooks/live config/includes.chroot/etc

          # ---- live-build configuration (pure live ISO; no d-i, no auto-firmware) ----
          cat > auto/config <<'CFG'
          #!/bin/sh
          set -e
          lb config noauto \
              --mode debian \
              --distribution bookworm \
              --architectures amd64 \
              --archive-areas "main contrib non-free non-free-firmware" \
              --debian-installer none \
              --firmware-chroot false \
              --firmware-binary false \
              --memtest none \
              --apt-recommends false \
              --iso-application "404 NOT FOUND OS" \
              --iso-publisher "404 NOT FOUND OS Project" \
              --iso-volume "404-NOT-FOUND-OS" \
              --bootappend-live "boot=live components username=ghost hostname=notfound locales=en_US.UTF-8 keyboard-layouts=us" \
              "${@}"
          CFG
          chmod +x auto/config

          # ---- MANDATORY base only (guaranteed to exist in Debian bookworm) ----
          cat > config/package-lists/base.list.chroot <<'PKG'
          live-boot
          live-config
          live-config-systemd
          task-xfce-desktop
          lightdm
          network-manager
          sudo
          locales
          zsh
          git
          curl
          wget
          vim
          net-tools
          python3
          python3-pip
          ca-certificates
          PKG

          # ---- ALL pentest tools: best-effort (missing ones skipped, build never fails) ----
          cat > config/hooks/live/0200-tools.hook.chroot <<'HOOK'
          #!/bin/sh
          set +e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          TOOLS="nmap masscan dnsutils dnsenum dnsrecon netdiscover whois \
                 sqlmap nikto whatweb wfuzz dirb \
                 john hashcat hydra medusa crunch cewl \
                 aircrack-ng kismet reaver wifite bettercap macchanger \
                 wireshark tshark tcpdump ettercap-graphical dsniff mitmproxy \
                 radare2 gdb binwalk apktool \
                 sleuthkit foremost libimage-exiftool-perl testdisk \
                 tor torsocks proxychains4 \
                 tmux htop jq unzip p7zip-full \
                 theharvester recon-ng amass gobuster ffuf wpscan zaproxy \
                 exploitdb beef-xss set metasploit-framework seclists wordlists \
                 nuclei autopsy volatility3 commix dmitry hashid"
          OK=""; SKIP=""
          for p in $TOOLS; do
              if apt-get install -y --no-install-recommends "$p" 2>/dev/null; then
                  OK="$OK $p"; echo "[tools] installed $p"
              else
                  SKIP="$SKIP $p"; echo "[tools] skipped  $p"
              fi
          done
          echo "================ TOOL INSTALL SUMMARY ================"
          echo "INSTALLED:$OK"
          echo "SKIPPED  :$SKIP"
          echo "====================================================="
          exit 0
          HOOK
          chmod +x config/hooks/live/0200-tools.hook.chroot

          # ---- branding ----
          cat > config/hooks/live/0100-branding.hook.chroot <<'HOOK'
          #!/bin/sh
          set -e
          mkdir -p /etc/lightdm
          cat > /etc/lightdm/lightdm-gtk-greeter.conf <<EOF
          [greeter]
          background=#04070a
          theme-name=Adwaita-dark
          clock-format=%H:%M  %a %d %b
          EOF
          mkdir -p /etc/skel/.config/gtk-3.0
          printf '[Settings]\ngtk-application-prefer-dark-theme=1\n' > /etc/skel/.config/gtk-3.0/settings.ini
          echo "branding applied."
          HOOK
          chmod +x config/hooks/live/0100-branding.hook.chroot

          cat > config/includes.chroot/etc/os-release <<'REL'
          PRETTY_NAME="404 NOT FOUND OS (ghost edition)"
          NAME="404 NOT FOUND OS"
          VERSION_ID="1.0"
          VERSION="1.0 (ghost)"
          VERSION_CODENAME=ghost
          ID=notfoundos
          ID_LIKE=debian
          ANSI_COLOR="1;31"
          REL

          echo "=== generated files ==="
          find auto config -type f

      - name: Build ISO inside Debian bookworm container
        run: |
          docker run --rm --privileged \
            -v /mnt/build:/build -w /build \
            debian:bookworm \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y live-build ca-certificates xorriso squashfs-tools dosfstools mtools
              lb config
              lb build
              ls -lh /build/*.iso
            '

      - name: Collect ISO + checksum
        run: |
          set -e
          iso=$(ls /mnt/build/*.iso | head -1)
          sudo cp "$iso" ./404-not-found-os-amd64.iso
          sudo chown "$USER" ./404-not-found-os-amd64.iso
          sha256sum 404-not-found-os-amd64.iso | tee 404-not-found-os-amd64.iso.sha256
          ls -lh 404-not-found-os-amd64.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          name: notfound-iso
          path: |
            404-not-found-os-amd64.iso
            404-not-found-os-amd64.iso.sha256
          retention-days: 14

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: |
            404-not-found-os-amd64.iso
            404-not-found-os-amd64.iso.sha256
